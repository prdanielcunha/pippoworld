<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6eedc" />
    <title>Mundo Pippo</title>
  </head>
  <body>
    <main>
      <header><div><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1></div><button id="pause" type="button" disabled></button></header>
      <section class="world" aria-label="Cena inicial do quintal">
        <canvas id="world" aria-label="Quintal tridimensional com estudo geométrico de patinho e bola azul"></canvas>
        <p id="status" role="status" aria-live="polite"></p>
        <div id="paused" class="overlay" hidden><p id="paused-label"></p><button id="resume" type="button"></button></div>
      </section>
      <footer><p id="notice"></p></footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
