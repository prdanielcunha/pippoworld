<!doctype html><html lang="pt-BR"><meta charset="utf-8"><style>body{font:16px system-ui;background:#eee8d8;margin:12px}button{padding:12px;margin:3px}iframe{width:390px;height:1020px;border:0;background:white}#report{white-space:pre-wrap;position:fixed;right:20px;top:210px;width:450px;height:650px;overflow:auto}#controls{position:sticky;top:0;background:#eee8d8;z-index:20}iframe{height:850px}</style><h1>Ensaio de contato — v23</h1><div id="controls"></div><label>Largura <select id="width"><option>390</option><option>940</option><option>320</option></select></label><pre id="report"></pre><iframe id="game" src="/"></iframe><script>
const frame=document.getElementById('game'),controls=document.getElementById('controls');let advance;
async function run(kind,index,ms=0,two=false){const w=frame.contentWindow;await w.PippoCanon.loading;await w.PippoMusicRig.prepare();w.document.querySelector('[data-place="music"]').click();w.document.querySelector('button[data-instrument="'+kind+'"]').click();const p=w.PippoMusicRig.performance;if(!advance)advance=p.advance;p.advance=()=>{};p.reset(kind);if(two)w.pippoStudy.react({music:true,instrument:kind,index:0,id:'first'});w.pippoStudy.react({music:true,instrument:kind,index,id:'review'});advance(ms);document.getElementById('report').textContent=JSON.stringify(w.PippoMusicRig.inspect(),null,1)}
for(const kind of ['keyboard','xylophone','drum','shaker','tambourine'])for(let i=0;i<(kind==='drum'?5:['keyboard','xylophone'].includes(kind)?8:1);i++){const b=document.createElement('button');b.textContent=kind+' '+i;b.onclick=()=>run(kind,i);controls.append(b)}
for(const [name,fn] of [['Duas notas',()=>run('keyboard',7,0,true)],['Recuo',()=>run('xylophone',4,90)],['Rápido',async()=>{const w=frame.contentWindow;await run('tambourine',0);for(let i=0;i<8;i++){advance(90);w.pippoStudy.react({music:true,instrument:'tambourine',index:0})}document.getElementById('report').textContent=JSON.stringify(w.PippoMusicRig.inspect(),null,1)}],['Retomar',()=>{frame.contentWindow.PippoMusicRig.performance.advance=advance;advance=null}]]){const b=document.createElement('button');b.textContent=name;b.onclick=fn;controls.append(b)}
const audit=document.createElement('button');audit.textContent='Conferir 69 contatos';audit.onclick=async()=>{const rows=[];for(const width of [320,390,940]){frame.style.width=width+'px';await new Promise(r=>setTimeout(r,60));for(const kind of ['keyboard','xylophone','drum','shaker','tambourine'])for(let i=0;i<(kind==='drum'?5:['keyboard','xylophone'].includes(kind)?8:1);i++){await run(kind,i);const w=frame.contentWindow,view=w.PippoMusicRig.inspect(),c=w.document.getElementById('musicHands'),ctx=c.getContext('2d'),hits=view.contacts.filter(h=>h.contact&&!h.foot);for(const h of hits){const px=h.tip.x*c.width/view.stage.width,py=h.tip.y*c.height/view.stage.height;const rgba=ctx.getImageData(Math.max(0,Math.round(px)-2),Math.max(0,Math.round(py)-2),5,5).data;let alpha=0;for(let k=3;k<rgba.length;k+=4)alpha=Math.max(alpha,rgba[k]);const delta=Math.hypot(h.tip.x-h.target.x,h.tip.y-h.target.y);rows.push({width,kind,index:i,delta,alpha,pass:delta<.1&&alpha>80&&h.tip.x>=0&&h.tip.x<=view.stage.width&&h.tip.y>=0&&h.tip.y<=view.stage.height})}if(kind==='drum'&&i===0)rows.push({width,kind,index:i,foot:!!view.contacts.find(h=>h.foot&&h.contact),pass:!!view.contacts.find(h=>h.foot&&h.contact)})}}document.getElementById('report').textContent=JSON.stringify({pass:rows.every(r=>r.pass),cases:rows.length,failures:rows.filter(r=>!r.pass)},null,2);document.getElementById('report').dataset.result=JSON.stringify(rows)};controls.append(audit);
const gait=document.createElement('button');gait.textContent='Conferir caminhada';gait.onclick=async()=>{const w=frame.contentWindow;await w.PippoCanon.loading;await w.PippoGait.prepare();for(let n=0;n<150&&!w.PippoGait.ready;n++)await new Promise(r=>setTimeout(r,30));let gallery=document.getElementById('gaitGallery');if(!gallery){gallery=document.createElement('div');gallery.id='gaitGallery';gallery.style.cssText='position:fixed;inset:210px 10px 10px 450px;overflow:auto;background:#dacfb7;z-index:30';document.body.append(gallery)}gallery.textContent='';for(let i=0;i<16;i++){const c=document.createElement('canvas');c.width=200;c.height=220;c.style.background=i%2?'#b4d4cc':'#e5d4c1';gallery.append(c);const ctx=c.getContext('2d');w.PippoGait.draw(ctx,{width:200,height:220,cx:100,bottom:210,bodyHeight:190},{walkDistance:i/16*190*.52,facing:-1})}const b=document.createElement('button');b.textContent='Fechar caminhada';b.onclick=()=>gallery.remove();gallery.prepend(b);document.getElementById('report').textContent=JSON.stringify(w.PippoGait.inspect())};controls.append(gait);
let stationAdvance;for(const time of [0,650,950,1100,1350,1599,1600]){const b=document.createElement('button');b.textContent='Entrada '+time;b.onclick=async()=>{const w=frame.contentWindow;await w.PippoCanon.loading;await w.PippoStation.prepare();if(!stationAdvance)stationAdvance=w.PippoStation.advance;w.PippoStation.advance=()=>{};w.document.querySelector('[data-place="music"]').click();stationAdvance(time);w.pippoStudy.setInstrument('keyboard');document.getElementById('report').textContent=JSON.stringify(w.PippoStation.inspect())};controls.append(b)}
document.getElementById('width').onchange=e=>frame.style.width=e.target.value+'px';</script>
